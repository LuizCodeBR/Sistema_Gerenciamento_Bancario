services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: banco
      MYSQL_USER: banco
      MYSQL_PASSWORD: ${DB_PASS:?Configure DB_PASS no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD no arquivo .env}
    volumes:
      - banco_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/banco?serverTimezone=UTC
      DB_USER: banco
      DB_PASS: ${DB_PASS:?Configure DB_PASS no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  banco_mysql:
